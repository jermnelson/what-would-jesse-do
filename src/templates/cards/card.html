 <div class="card" style="width: 18rem;" id="{{ topic.path.name }}">
   {% for image in topic.card_images %}
   <img src="{{ image_prefix }}static/imgs/{{ image.source }}" class="card-img-top" alt="{{ image.alt }}">
   {% endfor %}
   {% for video in topic.card_videos %}
   <video controls width="250">
     <source src="{{ image_prefix }}static/video/{{ video.source }}" type-"{{ video.type }}" />
     <p>
       Your browser doesn't support HTML video. Here is the download
       <a href="{{ image_prefix }}static/video/{{ video.source }}" download="{{ video.source }}">link</a>
     </p>
   </video>
   {% endfor %}
   <div class="card-body">
     <h5 class="card-title">{{ topic.title }}</h5>
     <h5 class="card-subtitle mb-2 text-body-secondary">
     {{ topic.author.name }}
     </h5>
     {{ topic.html|safe }}
    </div>
    <div class="card-footer text-body-secondary">
     <strong>Year(s):</strong> {% for year in topic.years %}<a href="{{ prefix }}/years/{{ year }}.html">{{ year[1:] }}</a>{% if not loop.last %},{% endif %}{% endfor %}
    </div>
</div>
